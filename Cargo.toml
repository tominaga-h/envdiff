[package]
name = "envdiff"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["tominaga-h"]
description = "Compare two .env files variable by variable"
license = "MIT"
repository = "https://github.com/tominaga-h/envdiff"
keywords = ["dotenv", "env", "diff", "cli", "environment"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
comfy-table = "7.2.2"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
